function navigate(page){game=null; ({home,setup,editor,review,results}[page]||home)();window.scrollTo(0,0)}function toggleLarge(){document.body.classList.toggle('large')}
function home(){const n=words().filter(allowed).length; $('app').innerHTML=`<h1>ひらがなを よもう！</h1><p>Čti hiraganu, poznávej obrázky a uč se japonská slovíčka. Začni od řad, které už znáš.</p><div class="message">📖 Právě studuješ: <b>${['','あ・か・さ・た・な','＋ は・ま・や・ら・わ','＋ znělé znaky','＋ malé znaky a dlouhé samohlásky'][state.settings.level]}</b> · ${n} dostupných slov ze ${words().length}.</div><div class="grid"><button class="tile" onclick="setup()"><span class="emoji">🎮</span><b>Začít hru</b><small>Psaní rómadži, obrázkový kvíz a přiřazování</small></button><button class="tile" onclick="review()"><span class="emoji">🧠</span><b>Procvičit chyby</b><small>${total()} slov čeká na opakování</small></button><button class="tile" onclick="editor()"><span class="emoji">✏️</span><b>Slovníček učitele</b><small>Uprav slova, přidávej fotografie a nová slova</small></button></div><p style="margin-top:24px">💡 <b>Tip:</b> Ve hře získáš jeden bod za správnou odpověď. Při chybě se slovo uloží k opakování. Čeština se odhalí až po odeslání.</p>`}
function setup(){let n=words().filter(allowed).length;$('app').innerHTML=`<div class="topbar"><h1>Nastavení hry</h1><button class="btn ghost" onclick="home()">Zpět</button></div><section class="panel"><div class="form-grid"><div><label class="field">Co už umíš?</label><select id="level"><option value="1">1 · あかさたな (30 slov)</option><option value="2">2 · Další řady až po わ</option><option value="3">3 · Znělé znaky (が, ざ, だ...)</option><option value="4">4 · Malé znaky, zdvojení, dlouhé samohlásky</option></select></div><div><label class="field">Téma</label><select id="theme"><option value="all">Všechna témata</option>${themes().map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div><label class="field">Počet otázek</label><select id="amount"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="100">Všechny dostupné</option></select></div><div><label class="field">Typ hry</label><select id="mode"><option value="mixed">Mix všech 3 her</option><option value="typing">Přepis do rómadži</option><option value="picture">Vyber správný obrázek</option><option value="matching">Vyber správnou rómadži</option></select></div></div><p id="count"></p><button class="btn" onclick="startFromSetup()">▶ Spustit hru</button></section><p>Poznámka: K dispozici je 100 slov rozdělených podle úrovní. Některá slova ve vyšších úrovních obsahují zvuky, které dosud neznáš.</p>`; for(let k of ['level','theme','amount','mode']){let e=$(k);e.value=state.settings[k];e.addEventListener('change',()=>{set(k,e.value);$('count').textContent=words().filter(allowed).length+' slov odpovídá výběru.'})} $('count').textContent=n+' dostupných slov.'}
function startFromSetup(){let pool=words().filter(allowed);if(!pool.length){alert('Pro toto nastavení nejsou žádná slova.');return}start(pool)}
function start(pool){let q=shuffle(pool).slice(0,Number(state.settings.amount));let modes=state.settings.mode==='mixed'?['typing','picture','matching']:[state.settings.mode];game={q:q.map((w,i)=>({w,mode:modes[i%modes.length]})),i:0,score:0,wrong:[],submitted:false,pick:null};renderQuestion()}
function imageOf(w,cls='symbol'){return w.image?`<img alt="Obrázek slovíčka" src="${esc(w.image)}">`:`<span class="${cls}" role="img" aria-label="${esc(w.cz)}">${esc(w.emoji||'🖼️')}</span>`}
function speak(jp){if(!('speechSynthesis' in window)){alert('Zařízení nepodporuje přehrávání řeči.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(jp);u.lang='ja-JP';u.rate=.75;let voices=speechSynthesis.getVoices(),v=voices.find(x=>x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
function makeOptions(w,mode){let other=shuffle(words().filter(x=>x.id!==w.id&&x.jp!==w.jp&&x.level<=Number(state.settings.level))).slice(0,3);let options=shuffle([w,...other]);game.options=options;return `<div class="options">${options.map((x,i)=>`<button class="option" id="opt${i}" onclick="choose(${i})">${mode==='picture'?`<span class="mini">${imageOf(x,'mini')}</span>`:esc(x.ro)}</button>`).join('')}</div>`}
function renderQuestion(){let {q,i,score}=game,{w,mode}=q[i];game.submitted=false;game.pick=null;let wordPart=mode==='picture'?`<div class="picture" style="height:145px"><span style="font-size:4rem">❔</span></div>`:`<div class="picture">${imageOf(w)}</div>`;let question=mode==='picture'?'Který obrázek patří ke slovu?':mode==='matching'?'Vyber správný přepis do rómadži.':'Přepiš japonské slovo do rómadži.'; $('app').innerHTML=`<div class="topbar"><span class="chip">Otázka ${i+1} / ${q.length}</span><span class="stat">⭐ ${score} bodů</span><button class="btn ghost" onclick="home()">Ukončit</button></div><div class="bar"><div style="width:${i/q.length*100}%"></div></div><section class="game"><div class="panel">${wordPart}<div class="jp">${esc(w.jp)}</div><div class="word-note">${esc(w.theme)} · Úroveň ${w.level}</div></div><div class="panel"><div class="label">${mode==='typing'?'✍️ Rómadži':mode==='picture'?'🖼️ Obrázky':'🔎 Rómadži'}</div><h2 style="margin-top:12px">${question}</h2>${mode==='typing'?'<input id="attempt" type="text" placeholder="Například: kasa" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitAnswer()}">':makeOptions(w,mode)}<div class="btn-row" style="margin-top:14px"><button class="btn secondary" onclick="speak(${JSON.stringify(w.jp).replace(/"/g,'&quot;')})">🔊 Poslech</button><button class="btn" id="send" onclick="submitAnswer()" disabled>Ověřit</button></div><div id="feedback"></div><div class="btn-row" style="margin-top:12px"><button class="btn hide" id="next" onclick="nextQuestion()">${i+1===q.length?'🏁 Výsledek':'Další slovo →'}</button></div></div></section>`;if(mode==='typing'){let e=$('attempt');e.addEventListener('input',()=>{$('send').disabled=!e.value.trim()});e.focus()}}
function choose(i){if(!game||game.submitted)return;game.pick=i;document.querySelectorAll('.option').forEach((e,j)=>e.classList.toggle('chosen',j===i));$('send').disabled=false}
function normalize(s){return s.toLowerCase().trim().replace(/[\s\-]/g,'').replace(/ō/g,'ou').replace(/ū/g,'uu')}
function submitAnswer(){if(!game||game.submitted)return;let {w,mode}=game.q[game.i],input=mode==='typing'?$('attempt').value:game.options[game.pick]?.id;let right=mode==='typing'?normalize(input)===normalize(w.ro):input===w.id;game.submitted=true;if(right){game.score++;if(state.mistakes[w.id])state.mistakes[w.id]=Math.max(0,state.mistakes[w.id]-1)}else{game.wrong.push(w.id);state.mistakes[w.id]=(state.mistakes[w.id]||0)+1}let stats=state.stats[w.id]||{seen:0,correct:0};stats.seen++;if(right)stats.correct++;state.stats[w.id]=stats;save();$('feedback').innerHTML=`<div class="answer ${right?'good':'bad'}"><b>${right?'✅ Správně!':'❌ Zkus si slovo zapamatovat!'}</b><div style="font-size:1.35rem;margin:5px 0"><b>${esc(w.jp)}</b> · ${esc(w.ro)}</div><div>🇨🇿 <strong>${esc(w.cz)}</strong></div>${!right?'<small>Slovo bylo přidáno do opakování.</small>':''}</div>`;$('send').disabled=true;$('next').classList.remove('hide');if($('attempt'))$('attempt').disabled=true;document.querySelectorAll('.option').forEach(e=>e.disabled=true)}
function nextQuestion(){if(++game.i>=game.q.length){results()}else renderQuestion()}
function results(){let g=game;$('app').innerHTML=`<h1>🎉 Hotovo!</h1><div class="panel" style="text-align:center"><div style="font-size:4rem">${g.score===g.q.length?'🏆':'🌸'}</div><h1>${g.score} / ${g.q.length}</h1><p>Správné odpovědi · ${Math.round(g.score/g.q.length*100)} %</p><div class="btn-row" style="justify-content:center"><button class="btn" onclick="setup()">Nová hra</button><button class="btn secondary" onclick="review()">Procvičit chyby (${total()})</button></div></div><h2 style="margin-top:25px">Slova z této hry</h2><div class="panel list">${g.q.map(({w})=>`<div class="word-row"><span class="em">${esc(w.emoji)}</span><span><b>${esc(w.jp)}</b> · ${esc(w.ro)}<br><small>${esc(w.cz)}</small></span><button class="btn ghost" onclick="speak('${w.jp}')">🔊</button></div>`).join('')}</div>`}
function review(){let pool=words().filter(w=>state.mistakes[w.id]>0);$('app').innerHTML=`<div class="topbar"><h1>🧠 Opakování chyb</h1><button class="btn ghost" onclick="home()">Zpět</button></div><div class="panel"><p>${pool.length?`Máš ${pool.length} slov k opakování. Správná odpověď sníží počet chyb u slova.`:'Zatím nemáš žádné nevyřešené chyby. Výborně!'}</p><div class="btn-row"><button class="btn" ${!pool.length?'disabled':''} onclick="start(words().filter(w=>state.mistakes[w.id]>0))">Procvičit teď</button><button class="btn warn" ${!pool.length?'disabled':''} onclick="if(confirm('Opravdu vymazat seznam chyb?')){state.mistakes={};save();review()}">Vymazat chyby</button></div></div><div class="panel list" style="margin-top:14px">${pool.map(w=>`<div class="word-row"><span class="em">${esc(w.emoji)}</span><span><b>${esc(w.jp)}</b> · ${esc(w.ro)} · ${esc(w.cz)}<br><small>Chybné odpovědi: ${state.mistakes[w.id]}</small></span><button class="btn ghost" onclick="speak('${w.jp}')">🔊</button></div>`).join('')}</div>`}
let editing=null;
function editor(){let all=words();$('app').innerHTML=`<div class="topbar"><h1>✏️ Slovníček učitele</h1><button class="btn ghost" onclick="home()">Domů</button></div><p>100 výchozích slov můžeš měnit. Vlastní slovíčka přidáš bez omezení. Obrázek lze nahrát z počítače.</p><div class="btn-row"><button class="btn" onclick="editWord(null)">＋ Přidat slovo</button><button class="btn secondary" onclick="exportData()">⬇ Export dat</button><label class="btn secondary" style="cursor:pointer">⬆ Import dat<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div><div style="margin:18px 0"><input id="search" type="text" placeholder="Hledej hiraganu, rómadži nebo český význam..." oninput="renderWords()"></div><div class="panel list" id="wordsList"></div><div class="panel hide" id="editPanel" style="margin-top:18px"></div>`;renderWords()}
function renderWords(){let q=($('search')?.value||'').toLowerCase();$('wordsList').innerHTML=words().filter(w=>[w.jp,w.ro,w.cz,w.theme].some(x=>x.toLowerCase().includes(q))).map(w=>`<div class="word-row"><span class="em">${esc(w.emoji)}</span><span><b>${esc(w.jp)}</b> · ${esc(w.ro)} · ${esc(w.cz)}<br><small>${esc(w.theme)} · L${w.level}</small></span><button class="btn ghost" onclick="editWord('${w.id}')">Upravit</button></div>`).join('')}
function editWord(id){editing=id;let w=words().find(x=>x.id===id)||{jp:'',ro:'',cz:'',emoji:'🌸',theme:'Vlastní',level:1,image:''};$('editPanel').classList.remove('hide');$('editPanel').innerHTML=`<h2>${id?'Upravit slovíčko':'Nové slovíčko'}</h2><div class="form-grid"><div><label class="field">Hiragana</label><input type="text" id="ejp" value="${esc(w.jp)}"></div><div><label class="field">Rómadži</label><input type="text" id="ero" value="${esc(w.ro)}"></div><div><label class="field">Český význam</label><input type="text" id="ecz" value="${esc(w.cz)}"></div><div><label class="field">Téma</label><input type="text" id="etheme" value="${esc(w.theme)}"></div><div><label class="field">Emoji jako náhradní obrázek</label><input type="text" id="eemoji" value="${esc(w.emoji)}"></div><div><label class="field">Úroveň (1–4)</label><select id="elevel">${[1,2,3,4].map(i=>`<option value="${i}" ${w.level===i?'selected':''}>${i}</option>`).join('')}</select></div><div><label class="field">Vlastní obrázek (volitelné)</label><input type="file" accept="image/*" id="eimage"><small>Pro offline použití. Doporučeno do 200 kB.</small></div></div><div class="btn-row" style="margin-top:16px"><button class="btn" onclick="saveWord()">Uložit</button><button class="btn ghost" onclick="$('editPanel').classList.add('hide')">Zrušit</button>${id&&id.startsWith('c')?`<button class="btn warn" onclick="deleteWord('${id}')">Smazat</button>`:''}${id&&id.startsWith('b')?`<button class="btn warn" onclick="resetWord('${id}')">Obnovit původní</button>`:''}</div>`;$('editPanel').scrollIntoView({behavior:'smooth',block:'start'})}
async function saveWord(){const val=id=>$(id).value.trim();let o={jp:val('ejp'),ro:val('ero').toLowerCase(),cz:val('ecz'),emoji:val('eemoji')||'🖼️',theme:val('etheme')||'Vlastní',level:Number(val('elevel'))};if(!o.jp||!o.ro||!o.cz){alert('Vyplň hiraganu, rómadži a český význam.');return}let file=$('eimage').files[0],prior=words().find(w=>w.id===editing);if(file){if(file.size>750000){alert('Obrázek je příliš velký. Vyber menší obrázek (do 750 kB).');return}o.image=await new Promise((r,rej)=>{let f=new FileReader;f.onload=()=>r(f.result);f.onerror=rej;f.readAsDataURL(file)})}else if(prior?.image)o.image=prior.image;if(editing){if(editing.startsWith('b'))state.edits[editing]=o;else state.custom=state.custom.map(w=>w.id===editing?{...w,...o}:w)}else state.custom.push({...o,id:'c'+Date.now()});if(save())editor()}
function resetWord(id){if(confirm('Obnovit původní slovíčko?')){delete state.edits[id];save();editor()}}function deleteWord(id){if(confirm('Smazat vlastní slovíčko?')){state.custom=state.custom.filter(w=>w.id!==id);save();editor()}}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hiragana-quest-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.custom)||typeof o.edits!=='object')throw Error('format');if(confirm('Import přepíše uložená data. Pokračovat?')){state={...state,...o,settings:{...state.settings,...o.settings}};save();editor()}}catch(e){alert('Soubor nemá správný formát.')}}home();
</script></body></html>
